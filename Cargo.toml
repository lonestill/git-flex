[package]
name = "git-flex"
version = "0.1.0"
edition = "2021"
authors = ["lonestill"]
description = "High-performance Git automation and cryptographic vanity hashing utility (TUI + CLI)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
sha1 = { version = "0.10", features = ["asm"] }
rayon = "1.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
